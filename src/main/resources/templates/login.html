<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Architecture Studio</title>

    <meta name="description"
          content="Login to Architecture Studio">

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<!-- ================================================= -->
<!-- Animated Background -->
<!-- ================================================= -->

<div class="background">

    <div class="gradient gradient1"></div>

    <div class="gradient gradient2"></div>

    <div class="gradient gradient3"></div>

    <div class="grid-overlay"></div>

    <div class="noise"></div>

</div>

<!-- ================================================= -->
<!-- Floating Particles -->
<!-- ================================================= -->

<div class="particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>

<!-- ================================================= -->
<!-- Login Wrapper -->
<!-- ================================================= -->

<div class="login-wrapper">

    <!-- ============================================= -->
    <!-- Left Branding -->
    <!-- ============================================= -->

    <div class="branding">

        <!-- Logo -->

        <a href="/" class="logo">

            <div class="logo-icon">

                <svg width="48"
                     height="48"
                     viewBox="0 0 64 64"
                     xmlns="http://www.w3.org/2000/svg">

                    <line x1="18" y1="18" x2="46" y2="18"/>
                    <line x1="18" y1="18" x2="18" y2="46"/>
                    <line x1="46" y1="18" x2="46" y2="46"/>
                    <line x1="18" y1="46" x2="46" y2="46"/>

                    <line x1="18" y1="18" x2="32" y2="32"/>
                    <line x1="46" y1="18" x2="32" y2="32"/>
                    <line x1="18" y1="46" x2="32" y2="32"/>
                    <line x1="46" y1="46" x2="32" y2="32"/>

                    <circle cx="18" cy="18" r="4"/>
                    <circle cx="46" cy="18" r="4"/>
                    <circle cx="18" cy="46" r="4"/>
                    <circle cx="46" cy="46" r="4"/>
                    <circle cx="32" cy="32" r="5"/>

                </svg>

            </div>

            <div class="logo-text">

                <span class="title">
                    Architecture
                </span>

                <span class="subtitle">
                    Studio
                </span>

            </div>

        </a>

        <!-- Heading -->

        <h1>

            Welcome Back

        </h1>

        <p>

            Continue designing modern distributed software
            architectures with real-time simulation,
            analytics and professional reports.

        </p>

        <!-- Mini Architecture -->
<div class="mini-architecture">

    <div class="node client">
        <i class="bi bi-laptop"></i>
        <span>Client</span>
    </div>

    <div class="line"></div>

    <div class="node gateway">
        <i class="bi bi-diagram-3-fill"></i>
        <span>Gateway</span>
    </div>

    <div class="services">

        <div class="node">
            <i class="bi bi-person-fill"></i>
            <span>User</span>
        </div>

        <div class="node">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Auth</span>
        </div>

        <div class="node">
            <i class="bi bi-cart-fill"></i>
            <span>Order</span>
        </div>

    </div>

    <div class="line"></div>

    <div class="node database-node">
        <i class="bi bi-database-fill"></i>
        <span>PostgreSQL</span>
    </div>

</div>

    </div>

    <!-- ============================================= -->
    <!-- Login Card -->
    <!-- ============================================= -->

    <div class="login-section">

        <div class="login-card">

            <h2>

                Sign In

            </h2>

            <p>

                Login to continue your journey.

            </p>

            <form id="loginForm">

                <!-- Email -->

                <div class="input-group">

                    <i class="bi bi-envelope"></i>

                    <input
                            type="email"
                            id="email"
                            placeholder="Email Address"
                            required>

                </div>

                <!-- Password -->

                <div class="input-group">

                    <i class="bi bi-lock"></i>

                    <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required>

                    <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

                <!-- Options -->

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

                <!-- Button -->

                <button
                        class="login-btn"
                        type="submit">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>

            <!-- Footer -->

            <div class="login-footer">

                Don't have an account?

                <a th:href="@{/register}">

                    Create Account

                </a>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/login.js}"></script>

</body>

</html>
