<svg width="128" height="128" viewBox="0 0 128 128"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->

    <defs>

        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="0%" stop-color="#3B82F6"/>

            <stop offset="100%" stop-color="#2563EB"/>

        </linearGradient>

    </defs>

    <!-- Outer Hexagon -->

    <polygon
        points="64,8 108,32 108,96 64,120 20,96 20,32"
        fill="url(#grad)"
        stroke="#60A5FA"
        stroke-width="2"/>

    <!-- Architecture Nodes -->

    <circle cx="64" cy="34" r="6" fill="#FFFFFF"/>

    <circle cx="40" cy="64" r="6" fill="#FFFFFF"/>

    <circle cx="88" cy="64" r="6" fill="#FFFFFF"/>

    <circle cx="64" cy="94" r="6" fill="#FFFFFF"/>

    <!-- Connections -->

    <line x1="64" y1="34" x2="40" y2="64"
          stroke="#FFFFFF"
          stroke-width="3"/>

    <line x1="64" y1="34" x2="88" y2="64"
          stroke="#FFFFFF"
          stroke-width="3"/>

    <line x1="40" y1="64" x2="64" y2="94"
          stroke="#FFFFFF"
          stroke-width="3"/>

    <line x1="88" y1="64" x2="64" y2="94"
          stroke="#FFFFFF"
          stroke-width="3"/>

</svg>